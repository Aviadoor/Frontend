<h2>Iniciar sesión</h2>

<form (ngSubmit)="login()">
    <label>Usuario</label>

    <input
    type="text"
    name="username"
    [(ngModel)]="username"
    required>

    <br><br>

    <label>Contraseña</label>
   
    <input
    type="password"
    name="password"
    [(ngModel)]="password"
    required>

    <br><br>
    
    <button type="submit">
    Ingresar
    </button>
</form>
